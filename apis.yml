name: Diablo Technologies
description: 'Diablo Technologies Inc. was an enterprise memory technology company backed by Battery
  Ventures. It developed Memory Channel Storage (MCS), an architecture that placed flash storage directly
  on the DDR memory bus, and productized it as Memory1, a flash-as-DRAM DIMM the company marketed as
  delivering up to 256 GB of memory per module and 4 TB per dual-socket server. Diablo positioned itself
  as a silicon and module vendor selling through server and storage OEM partners rather than as a
  software or platform company: it never published a public API, developer portal, SDK, or any
  machine-readable specification, and no developer surface appears anywhere in the archived record of
  its website. The company appears to be defunct. Its corporate site is last archived intact in 2017,
  the domain subsequently served unrelated SEO spam, the diablo-technologies.com registration lapsed and
  was re-registered on 2023-10-08 through a different registrar, and the hostname today serves an
  unrelated consumer-gadget review blog with no connection to the memory business. No GitHub
  organization exists under either diablo-technologies or diablotechnologies. This profile is retained
  as a historical company record with no API surface.'
